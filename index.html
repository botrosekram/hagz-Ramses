<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>حجز العربة</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#F4F6F3;--card:#fff;--ink:#0F2A2E;--mut:#5d6f6b;--line:#D5DDD9;--go:#1B9A6C;--amb:#F5B335;--red:#B3261E}
@media(prefers-color-scheme:dark){:root{--bg:#0C1A1D;--card:#142A2E;--ink:#E8F0EE;--mut:#9DB0AB;--line:#2A4247}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic',Tahoma,sans-serif;line-height:1.6;padding-top:env(safe-area-inset-top,0)}
.w{max-width:640px;margin:0 auto;padding:16px}h1{font-size:22px;margin:0}.mut{color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:14px}
.tabs{display:flex;gap:8px;margin-top:14px}.tabs button{flex:1}
button,select,input,textarea{font:inherit;color:var(--ink)}
button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer}
button.on,button.go{background:var(--go);border-color:var(--go);color:#fff}button.red{background:var(--red);border-color:var(--red);color:#fff}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:3px solid var(--amb);outline-offset:2px}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);margin-top:4px}
label{display:block;font-weight:600;font-size:14px;margin-top:10px}
.ban{border-radius:12px;padding:12px 14px;font-weight:700;margin-top:14px;background:var(--card);border:1px solid var(--line)}.ban.g{background:var(--go);border-color:var(--go);color:#fff}
.cnt{display:flex;gap:8px;margin-top:14px}.cnt div{flex:1;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px}.cnt b{font-size:24px;display:block}
ol.m{list-style:none;margin:14px 0 0;padding:0}ol.m li{position:relative;display:flex;gap:14px;padding-bottom:18px}
ol.m li:not(:last-child)::before{content:"";position:absolute;right:13px;top:26px;bottom:-2px;width:5px;border-radius:3px;background:var(--line)}
ol.m li.p:not(:last-child)::before{background:var(--go)}
.dot{z-index:1;flex:none;width:28px;height:28px;border-radius:50%;background:#9AA9A4;color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
li.p .dot{background:var(--go)}li.c .dot{background:var(--go);color:#fff;width:36px;height:36px;margin:-4px -4px 0;animation:blink 1s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1;box-shadow:0 0 0 4px rgba(27,154,108,.45)}50%{opacity:.35;box-shadow:0 0 0 12px rgba(27,154,108,0)}}
@media(prefers-reduced-motion:reduce){li.c .dot{animation:none;box-shadow:0 0 0 5px rgba(27,154,108,.45)}}
.nm{flex:1;display:flex;justify-content:space-between;gap:8px}li.c .nm b{font-size:18px}
.chip{font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:1px 10px;white-space:nowrap;align-self:flex-start}
.row{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line)}.row:first-child{border-top:0}
.no{flex:none;min-width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-weight:700;background:var(--go);color:#fff}.no.w{background:var(--amb);color:#0F2A2E}
.row .t{flex:1;min-width:0}.row small{display:block;color:var(--mut)}.row .a{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}.row .a button{padding:4px 9px;font-size:14px}
.tm{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
#toast{position:fixed;inset-inline:16px;bottom:16px;background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 14px;font-weight:600;display:none;z-index:9;max-width:608px;margin:auto}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);width:min(92vw,420px)}dialog::backdrop{background:rgba(0,0,0,.5)}
footer{text-align:center;color:var(--mut);font-size:13px;padding:18px 0 8px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
details{border-top:1px solid var(--line);padding:6px 0}summary{cursor:pointer;font-weight:600}
</style></head><body><div class="w">
<h1>حجز العربة - رحلة الصبح</h1><div class="mut">أول 14 حاجز لهم الأولوية (حسب وقت الحجز بالثانية)، والباقي احتياطي بالترتيب</div>
<div class="tabs"><button id="t1" class="on">الراكب</button><button id="t2">السائق / المساعد</button></div>
<div id="ban" class="ban" aria-live="polite">جارٍ التحميل…</div>
<div class="cnt"><div><b id="c1">0</b>مؤكد من 14</div><div><b id="c2">0</b>احتياطي</div><div><b id="c3">14</b>مقاعد فاضية</div></div>

<section id="p1"><div class="card"><b>احجز مقعدك</b>
<label for="nm">الاسم</label><input id="nm" autocomplete="off" placeholder="اكتب اسمك">
<label for="st">هتركب منين؟</label><select id="st"></select>
<label for="dr">هتنزل فين؟</label><select id="dr"></select>
<input id="dro" placeholder="اكتب اسم محطة النزول" hidden style="margin-top:8px">
<button class="go" id="bk" style="width:100%;margin-top:14px;padding:13px">احجز</button></div></section>

<section id="p2" hidden>
<div class="card" id="lg"><b>دخول السائق أو المساعد</b><label for="pw">كلمة المرور</label><input id="pw" type="password" autocomplete="off">
<button class="go" id="lgb" style="width:100%;margin-top:12px">دخول</button></div>
<div class="card" id="sp" hidden><div style="display:flex;justify-content:space-between;align-items:center"><b id="who"></b><button id="out">خروج</button></div>
<div class="g2"><button class="go" id="win">تحديد موعد الحجز</button><button class="red" id="closeNow">قفل الحجز الآن</button>
<button class="go" id="start">بدأت الرحلة</button><button id="next">وصلنا المحطة التالية</button><button class="red" id="end">إنهاء الرحلة</button><button id="reset">رحلة جديدة (تصفير)</button>
<button id="add">+ إضافة راكب يدويًا</button><button id="stn">إدارة المحطات</button><button id="pws">تغيير كلمات المرور</button></div></div>
<div class="card" id="sum" hidden><b>كشف الركاب بالمحطات</b><div id="sumb"></div></div></section>

<div class="card"><b>خط السير</b><ol class="m" id="metro"></ol></div>
<div class="card"><b>قائمة الحجز بالترتيب</b><div id="list"></div></div>
<footer>© 2026 Botros Ekram. جميع الحقوق محفوظة</footer></div>
<dialog id="dlg"><form id="dform" method="dialog"><h3 id="dt" style="margin:0"></h3><div id="df"></div><div class="g2"><button class="go" id="dok">حفظ</button><button value="cancel" formnovalidate>إلغاء</button></div></form></dialog>
<dialog id="dlg2"><div id="mg"></div><button id="mgx" style="width:100%;margin-top:14px">إغلاق</button></dialog>
<div id="toast" role="status"></div>
<script>
/* ===== بيانات Supabase (المفتاح العام فقط، ممنوع تحط المفتاح السري هنا) ===== */
const SUPABASE_URL='https://mrpurzkndrywpbtmmvfy.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_kDKHseCDTvBIUEUactKwug_8PhE_2j6';
/* ============================================================================ */
const CAP=14;
const $=i=>document.getElementById(i),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sb=SUPABASE_URL?supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;
let B=[],ST=[],T={status:'open',cur:-1,open_at:null,close_at:null},role=null,PW='',notes={},mine={},prev=null,off=0,ch=null,poll=null,edgeT=null;
/* mine[id] = {t: توكن سري يثبت إن الحجز بتاعك, n: ملاحظتك} */
try{const m=JSON.parse(localStorage.getItem('mine')||'{}');for(const k in m)if(m[k]&&typeof m[k]==='object'&&m[k].t)mine[k]=m[k];PW=sessionStorage.getItem('pw')||''}catch(e){}
const saveMine=()=>{try{localStorage.setItem('mine',JSON.stringify(mine))}catch(e){}};
const newToken=()=>{try{return crypto.randomUUID()}catch(e){return Array.from({length:4},()=>Math.random().toString(36).slice(2)).join('')+Date.now()}};
const devId=()=>{try{let d=localStorage.getItem('dev');if(!d||d.length<16){d=newToken();localStorage.setItem('dev',d)}return d}catch(e){return newToken()}};
const now=()=>Date.now()+off;
const isOpen=()=>T.status==='open'&&!!T.open_at&&!!T.close_at&&now()>=Date.parse(T.open_at)&&now()<Date.parse(T.close_at);
const fmtDT=iso=>new Date(iso).toLocaleString('ar-EG',{timeZone:'Africa/Cairo',weekday:'long',day:'numeric',month:'long',hour:'numeric',minute:'2-digit'});
function fmtT(iso){if(!iso)return'';const d=new Date(iso),m=/\.(\d+)/.exec(iso),ms=(m?m[1]:'000').padEnd(3,'0').slice(0,3);
 const dt=d.toLocaleDateString('en-GB',{timeZone:'Africa/Cairo',day:'2-digit',month:'2-digit'}),tm=d.toLocaleTimeString('en-GB',{timeZone:'Africa/Cairo',hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'});
 return `${dt} ${tm}.${ms}`}
const toLocalInput=ms=>{const d=new Date(ms-new Date(ms).getTimezoneOffset()*60000);return d.toISOString().slice(0,16)};
const P=()=>ST.filter(s=>s.kind==='pickup').sort((a,b)=>a.ord-b.ord),D=()=>ST.filter(s=>s.kind==='drop').sort((a,b)=>a.ord-b.ord),nm=id=>(ST.find(s=>s.id===id)||{}).name||'؟';
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',4500)}
function tab(n){$('p1').hidden=n!=1;$('p2').hidden=n!=2;$('t1').className=n==1?'on':'';$('t2').className=n==2?'on':''}
$('t1').onclick=()=>tab(1);$('t2').onclick=()=>tab(2);
if(!sb)$('ban').textContent='الصفحة لسه مش متوصلة بقاعدة البيانات.';

function fillSel(){const k=JSON.stringify(ST);if(fillSel.k===k)return;fillSel.k=k;const s=$('st').value,d=$('dr').value;
 $('st').innerHTML='<option value="">اختر محطة الركوب</option>'+P().map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');
 $('dr').innerHTML='<option value="">اختر محطة النزول</option>'+D().map(x=>`<option value="${esc(x.name)}">${esc(x.name)}</option>`).join('')+'<option value="other">أخرى (اكتب اسم المحطة)</option>';
 if(s)$('st').value=s;if(d)$('dr').value=d}
$('dr').onchange=()=>{$('dro').hidden=$('dr').value!=='other'};

async function rpc(fn,args,ok){const {data,error}=await sb.rpc(fn,args);
 if(error){toast(error.message);if(error.message.includes('كلمة المرور غير صحيحة'))logout();return null}
 if(ok)toast(ok);await load();return {data}}
function logout(){role=null;PW='';notes={};try{sessionStorage.removeItem('pw')}catch(e){}syncLive();render()}

/* التحديث اللحظي شغال بس وقت الحجز (للركاب) أو طول الوقت (للمسؤولين) */
function syncLive(){const want=!!sb&&(!!role||isOpen());
 if(want&&!ch){ch=sb.channel('live').on('postgres_changes',{event:'*',schema:'public',table:'bookings'},load).on('postgres_changes',{event:'*',schema:'public',table:'trip'},load).on('postgres_changes',{event:'*',schema:'public',table:'stops'},load).subscribe();poll=setInterval(load,30000)}
 if(!want&&ch){sb.removeChannel(ch);ch=null;clearInterval(poll);poll=null}}
function scheduleEdge(){clearTimeout(edgeT);const n=now(),e=[T.open_at,T.close_at].filter(Boolean).map(Date.parse).filter(x=>x>n).sort((a,b)=>a-b)[0];
 if(e)edgeT=setTimeout(load,Math.min(e-n+400,2147000000))}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&sb&&prev)load()});

async function load(){if(!sb)return;
 const [b,t,s,sn]=await Promise.all([sb.from('bookings').select('*').order('ord'),sb.from('trip').select('*').eq('id',1).single(),sb.from('stops').select('*'),sb.rpc('server_now')]);
 if(b.error||t.error||s.error){$('ban').textContent='تعذر الاتصال بقاعدة البيانات. تأكد إنك شغّلت setup-all.sql ثم update2.sql في Supabase.';return}
 if(!sn.error&&sn.data)off=Date.parse(sn.data)-Date.now();
 const old=prev;B=b.data;T=t.data;ST=s.data;fillSel();
 let ch2=false;for(const k of Object.keys(mine))if(!B.some(x=>String(x.id)===k)){delete mine[k];ch2=true}if(ch2)saveMine();
 if(role){const n=await sb.rpc('staff_notes',{pw:PW});if(n.error){logout();return}notes={};n.data.forEach(x=>notes[x.booking_id]=x.note)}
 if(old){const was=new Set(old.all),oc=new Set(old.conf);const up=B.slice(0,CAP).filter(x=>!oc.has(x.id)&&was.has(x.id));
  if(up.length)toast('اتأكد حجز '+up.map(x=>x.name).join(' و ')+' بدل المعتذر')}
 prev={all:B.map(x=>x.id),conf:B.slice(0,CAP).map(x=>x.id)};syncLive();scheduleEdge();render()}

$('bk').onclick=async()=>{const n=$('nm').value.trim(),sv=$('st').value,dv=$('dr').value,drop=dv==='other'?$('dro').value.trim():dv;
 if(!isOpen())return toast('الحجز مقفول دلوقتي');
 if(Object.keys(mine).length)return toast('تم الحجز مسبقًا من الموبايل ده. لو عايز تحجز تاني الغي حجزك الأول');
 if(n.length<2)return toast('اكتب اسمك الأول');if(!sv)return toast('اختار محطة الركوب');if(drop.length<2)return toast('اختار محطة النزول أو اكتبها');
 const tk=newToken();const r=await rpc('book',{p_name:n,p_stop:+sv,p_drop:drop,p_token:tk,p_device:devId()});if(!r)return;
 mine[r.data]={t:tk,n:''};saveMine();$('nm').value='';$('dro').value='';const pos=B.findIndex(x=>x.id===r.data)+1;
 toast(pos<=CAP?`تم حجزك، رقمك ${pos}`:`الرحلة مكتملة، انت احتياطي رقم ${pos-CAP}`);render()};

$('lgb').onclick=async()=>{const pw=$('pw').value;const {data,error}=await sb.rpc('login',{pw});
 if(error||!data)return toast('كلمة المرور غير صحيحة');role=data;PW=pw;try{sessionStorage.setItem('pw',pw)}catch(e){};$('pw').value='';await load()};
$('pw').onkeydown=e=>{if(e.key==='Enter')$('lgb').click()};
$('out').onclick=logout;
$('start').onclick=()=>confirm('بدء الرحلة وقفل الحجز؟')&&rpc('staff_trip',{pw:PW,act:'start'},'بدأت الرحلة');
$('next').onclick=()=>rpc('staff_trip',{pw:PW,act:'next'});
$('end').onclick=()=>confirm('إنهاء الرحلة؟')&&rpc('staff_trip',{pw:PW,act:'end'});
$('reset').onclick=()=>confirm('تصفير الرحلة؟ هيتمسح كل الحجوزات والملاحظات وموعد الحجز')&&confirm('متأكد؟ مفيش رجوع')&&rpc('staff_trip',{pw:PW,act:'reset'},'تم تصفير الرحلة');

function form(title,fields,ok){$('dt').textContent=title;
 $('df').innerHTML=fields.map(f=>`<label>${f.l}`+(f.t==='sel'?`<select name="${f.k}">${f.o.map(o=>`<option value="${o[0]}" ${o[0]==f.v?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`:f.t==='area'?`<textarea name="${f.k}" rows="3">${esc(f.v)}</textarea>`:`<input name="${f.k}" type="${f.t||'text'}" value="${esc(f.v)}" ${f.dl?'list="dl"':''}>`)+'</label>').join('')+`<datalist id="dl">${D().map(x=>`<option value="${esc(x.name)}">`).join('')}</datalist>`;
 $('dok').onclick=e=>{e.preventDefault();const v={};new FormData($('dform')).forEach((x,k)=>v[k]=x);$('dlg').close();ok(v)};$('dlg').showModal()}
const pk=()=>P().map(s=>[s.id,s.name]);

/* موعد الحجز (المسؤولين) */
$('win').onclick=()=>form('تحديد موعد الحجز',[
 {k:'o',l:'يفتح الحجز',t:'datetime-local',v:toLocalInput(T.open_at?Date.parse(T.open_at):now())},
 {k:'c',l:'يقفل الحجز',t:'datetime-local',v:toLocalInput(T.close_at?Date.parse(T.close_at):now()+3600000)}],
 v=>{if(!v.o||!v.c)return toast('اكتب الوقتين');rpc('staff_set_window',{pw:PW,p_open:new Date(v.o).toISOString(),p_close:new Date(v.c).toISOString()},'تم تحديد موعد الحجز')});
$('closeNow').onclick=()=>{if(!confirm('قفل الحجز دلوقتي؟'))return;const n=now(),o=T.open_at?Math.min(Date.parse(T.open_at),n-1000):n-1000;
 rpc('staff_set_window',{pw:PW,p_open:new Date(o).toISOString(),p_close:new Date(n).toISOString()},'تم قفل الحجز')};

$('add').onclick=()=>form('إضافة راكب',[{k:'n',l:'الاسم',v:''},{k:'s',l:'محطة الركوب',t:'sel',o:pk(),v:''},{k:'d',l:'محطة النزول (اختار أو اكتب)',v:'',dl:1}],v=>v.n.trim().length>1&&rpc('staff_add',{pw:PW,p_name:v.n,p_stop:+v.s,p_drop:v.d},'تمت الإضافة'));
$('pws').onclick=()=>role!=='driver'?toast('تغيير كلمات المرور للسائق فقط'):form('تغيير كلمات المرور',[{k:'a',l:'كلمة مرور السائق الجديدة (اتركها فاضية لو مش عايز تغيرها)',t:'password',v:''},{k:'b',l:'كلمة مرور المساعد الجديدة (اتركها فاضية لو مش عايز تغيرها)',t:'password',v:''}],async v=>{
  if(v.a){const r=await rpc('staff_set_pw',{pw:PW,which:'driver',newpw:v.a});if(r){PW=v.a;try{sessionStorage.setItem('pw',PW)}catch(e){}}}
  if(v.b)await rpc('staff_set_pw',{pw:PW,which:'helper',newpw:v.b});toast('تم')});

/* إدارة المحطات */
function fillAfter(){const k=$('ak').value;$('aa').innerHTML='<option value="0">في الآخر</option><option value="-1">في الأول</option>'+(k==='pickup'?P():D()).map(s=>`<option value="${s.id}">بعد: ${esc(s.name)}</option>`).join('')}
function renderMgr(){const li=l=>l.map(s=>`<div class="row"><div class="t">${esc(s.name)}</div><div class="a"><button data-m="ren" data-i="${s.id}">تعديل</button><button data-m="del" data-i="${s.id}">✕</button></div></div>`).join('');
 $('mg').innerHTML=`<h3 style="margin:0 0 6px">محطات الركوب (خط السير)</h3>${li(P())}<h3 style="margin:16px 0 6px">محطات النزول</h3>${li(D())}<h3 style="margin:16px 0 0">إضافة محطة</h3>
 <label>النوع<select id="ak"><option value="pickup">ركوب (في خط السير)</option><option value="drop">نزول</option></select></label><label>الاسم<input id="an"></label><label>مكانها<select id="aa"></select></label>
 <button class="go" id="ab" style="width:100%;margin-top:10px">إضافة المحطة</button>`;
 fillAfter();$('ak').onchange=fillAfter;
 $('ab').onclick=async()=>{const n=$('an').value.trim();if(n.length<2)return toast('اكتب اسم المحطة');const r=await rpc('staff_add_stop',{pw:PW,p_kind:$('ak').value,p_name:n,p_after:+$('aa').value},'تمت إضافة المحطة');if(r)renderMgr()}}
$('stn').onclick=()=>{renderMgr();$('dlg2').showModal()};$('mgx').onclick=()=>$('dlg2').close();
$('mg').onclick=async e=>{const b=e.target.closest('button[data-m]');if(!b)return;const id=+b.dataset.i,s=ST.find(x=>x.id===id);
 if(b.dataset.m==='ren'){const n=prompt('الاسم الجديد للمحطة',s.name);if(n&&n.trim().length>1){await rpc('staff_rename_stop',{pw:PW,p_id:id,p_name:n},'تم التعديل');renderMgr()}}
 if(b.dataset.m==='del'&&confirm('حذف محطة '+s.name+'؟')){await rpc('staff_delete_stop',{pw:PW,p_id:id},'تم الحذف');renderMgr()}};

$('list').onclick=e=>{const b=e.target.closest('button');if(!b)return;const id=+b.dataset.i,x=B.find(y=>y.id===id),a=b.dataset.a,mm=mine[id];
 if(a==='note'&&mm)form('ملاحظة للسائق',[{k:'n',l:'اكتب ملاحظتك (السائق والمسؤولين بس هيشوفوها)',t:'area',v:mm.n||''}],async v=>{const r=await rpc('set_note',{p_id:id,p_token:mm.t,p_note:v.n},'تم حفظ الملاحظة');if(r){mm.n=v.n.trim();saveMine();render()}});
 if(a==='myedit'&&mm)form('تعديل بيانات حجزك',[{k:'n',l:'الاسم',v:x.name},{k:'s',l:'محطة الركوب',t:'sel',o:pk(),v:x.stop_id},{k:'d',l:'محطة النزول (اختار أو اكتب)',v:x.drop_name||'',dl:1}],v=>v.n.trim().length>1&&rpc('edit_mine',{p_id:id,p_token:mm.t,p_name:v.n,p_stop:+v.s,p_drop:v.d},'تم التعديل'));
 if(a==='cancel'&&mm&&confirm('إلغاء حجزك؟')){rpc('cancel_mine',{p_id:id,p_token:mm.t},'تم إلغاء حجزك').then(r=>{if(r){delete mine[id];saveMine()}})}
 if(a==='edit')form('تعديل بيانات الراكب',[{k:'n',l:'الاسم',v:x.name},{k:'s',l:'محطة الركوب',t:'sel',o:pk(),v:x.stop_id},{k:'d',l:'محطة النزول (اختار أو اكتب)',v:x.drop_name||'',dl:1}],v=>v.n.trim().length>1&&rpc('staff_edit',{pw:PW,p_id:id,p_name:v.n,p_stop:+v.s,p_drop:v.d},'تم التعديل'));
 if(a==='del'&&confirm('حذف '+x.name+'؟'))rpc('staff_delete',{pw:PW,p_id:id},'تم الحذف');
 if(a==='up')rpc('staff_move',{pw:PW,p_id:id,p_dir:-1});if(a==='dn')rpc('staff_move',{pw:PW,p_id:id,p_dir:1})};

function banner(){if(T.status==='going'){const c=P().find(s=>s.ord===T.cur);return `السائق بدأ الرحلة - العربة دلوقتي عند: ${c?c.name:'—'}`}
 if(T.status==='done')return 'انتهت الرحلة';
 if(!T.open_at||!T.close_at)return 'الحجز مقفول - لسه المسؤولين محددوش ميعاد الحجز';
 if(now()<Date.parse(T.open_at))return 'الحجز هيفتح: '+fmtDT(T.open_at);
 if(now()>=Date.parse(T.close_at))return 'الحجز اتقفل - انتهى الوقت المحدد. القائمة دي هي الترتيب النهائي';
 return 'الحجز مفتوح لحد: '+fmtDT(T.close_at)}

function render(){const c=B.slice(0,CAP),w=B.length-c.length,going=T.status!=='open',st=!!role,PS=P(),curS=PS.find(s=>s.ord===T.cur),open=isOpen();
 $('c1').textContent=c.length;$('c2').textContent=w;$('c3').textContent=Math.max(0,CAP-c.length);
 const b=$('ban');b.className='ban'+(T.status==='going'||open?' g':'');b.textContent=banner();
 $('metro').innerHTML=PS.map((s,i)=>{const k=c.filter(x=>x.stop_id===s.id).length,cl=T.status==='done'||(going&&T.cur>s.ord)?'p':(going&&T.cur===s.ord?'c':'');
  return `<li class="${cl}"><span class="dot">${i+1}</span><div class="nm"><span>${cl==='c'?'<b>'+esc(s.name)+'</b>':esc(s.name)}</span>${k?`<span class="chip">${k} صعود</span>`:''}</div></li>`}).join('');
 $('list').innerHTML=B.length?B.map((x,i)=>{const mm=mine[x.id],m=!!mm;
  const nt=st&&notes[x.id]?`<small>📝 ${esc(notes[x.id])}</small>`:(m&&mm.n?'<small>📝 ملاحظتك اتبعتت للسائق</small>':'');
  const act=(st?`<button data-a="edit" data-i="${x.id}">تعديل</button><button data-a="up" data-i="${x.id}" aria-label="أعلى">↑</button><button data-a="dn" data-i="${x.id}" aria-label="أسفل">↓</button><button data-a="del" data-i="${x.id}" aria-label="حذف">✕</button>`:'')
   +(m&&T.status!=='done'?`<button data-a="note" data-i="${x.id}" aria-label="ملاحظة">✏️</button>`:'')
   +(m&&open&&!st?`<button data-a="myedit" data-i="${x.id}">تعديل</button><button data-a="cancel" data-i="${x.id}">إلغاء</button>`:'');
  return `<div class="row"><span class="no ${i<CAP?'':'w'}">${i+1}</span><div class="t">${esc(x.name)}${m?' (أنت)':''}<small>${i<CAP?'مؤكد':'احتياطي رقم '+(i-CAP+1)} - من ${esc(nm(x.stop_id))} إلى ${esc(x.drop_name||'—')}</small><small>🕒 وقت الحجز: <span class="tm">${esc(fmtT(x.created_at))}</span></small>${nt}</div><div class="a">${act}</div></div>`}).join(''):'<p class="mut">مفيش حجوزات لسه. أول حاجز هيبقى رقم 1.</p>';
 $('bk').disabled=!open;
 $('lg').hidden=st;$('sp').hidden=!st;$('sum').hidden=!st;
 if(st){$('who').textContent=role==='driver'?'السائق':'المساعد';$('start').disabled=T.status!=='open';$('next').disabled=T.status!=='going'||!PS.some(s=>s.ord>T.cur);$('end').disabled=T.status!=='going';$('closeNow').disabled=!open;$('win').disabled=T.status!=='open';
  $('sumb').innerHTML=PS.map((s,i)=>{const l=c.filter(x=>x.stop_id===s.id);return `<details ${l.length?'open':''}><summary>${i+1}. ${esc(s.name)} - ${l.length} راكب</summary>${l.map(x=>`<div>${esc(x.name)} ← ${esc(x.drop_name||'—')}${notes[x.id]?' - 📝 '+esc(notes[x.id]):''}</div>`).join('')||'<div class="mut">لا أحد</div>'}</details>`}).join('')}}

if(sb){(async()=>{if(PW){const {data}=await sb.rpc('login',{pw:PW});role=data||null;if(!role)logout()}await load()})()}
render();
</script></body></html>
